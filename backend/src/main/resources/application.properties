spring.application.name=gym-plus

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Autenticacao JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=28800

# Administrador inicial (criado somente se o email ainda nao existir)
app.admin.nome=${ADMIN_NOME:}
app.admin.cpf=${ADMIN_CPF:}
app.admin.telefone=${ADMIN_TELEFONE:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
